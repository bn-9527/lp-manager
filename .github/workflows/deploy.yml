name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      # FIX: 本地 node 25 / npm 11 生成的 lockfile 与 CI node 22 的 npm 不兼容，
      # npm ci 报 "package.json and package-lock.json are in sync" 错误。
      # 使用 npm install 兼容跨版本 lockfile。
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
